name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR branch supersedes the run in flight. Never on main: work lands there
# directly, so that run is the only one a commit ever gets, and cancelling it because a
# second push arrived left the first commit unvalidated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  CHECK_JSONSCHEMA_VERSION: "0.38.0"

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung Docker build would otherwise burn the 6h default before anyone noticed.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The one file whose breakage is silent: an invalid dependabot.yml disables
      # Dependabot entirely, with no error anywhere.
      - name: Validate workflows and Dependabot config
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color .github/workflows/*.yml
          rm -f ./actionlint
          python -m pip install --quiet "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json \
            .github/dependabot.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version from package.json#packageManager

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm run check

      # Buildx with a GitHub Actions cache: plain `docker build` rebuilt every layer from
      # scratch on each run, including the pnpm install. `load: true` puts the result in the
      # local daemon so the smoke test below can actually run it.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Verify Docker image build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          tags: vuzon-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker build` does not prove the image boots. The script is shared with
      # ghcr-publish.yml — it used to be copy-pasted into both, and the release copy is the
      # one that must not drift, since it is the last check before a push to GHCR.
      # It cleans up its own container and volume on exit.
      - name: Smoke test the image (boots, hardened, serves the SPA)
        run: .github/scripts/smoke-test.sh vuzon-ci vuzon-smoke

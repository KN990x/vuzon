name: Release → GHCR

on:
  release:
    types: [published]
  # Manual republish of an existing release tag after a transient Actions outage
  # (e.g. "Failed to resolve action download info"). Not a local-publish path.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v2.0.0)
        required: true
        type: string

# `contents` stays read at the workflow level; only the asset-upload step needs write, and
# it is granted there. Everything before it runs without the ability to alter the release.
permissions:
  contents: read
  packages: write

# Never cancelled mid-flight: a half-pushed multi-arch manifest is worse than a duplicate
# run, so releases queue instead of superseding each other.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # Emulated arm64 is slow enough to be worth bounding explicitly; without this a hung
    # QEMU build sits on the runner for the 6h default.
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The image tag comes from the release tag, but the bundle inside comes from the
      # commit. Publishing v2.1.0 from a tree that still says 2.0.0 produced an image
      # labelled 2.1.0 containing 2.0.0, and every bug report from it quoted the wrong
      # version. repository-guard.test.js checks the three manifests agree with each other;
      # only the release tag can be checked here.
      #
      # It runs FIRST on purpose. It needs nothing but jq and package.json, and it is the
      # step that has actually failed — twice, on v2.0.1 and v2.0.2 — so paying for the
      # toolchain and the full `pnpm run check` before it just delayed the same verdict by
      # ~40s. `pnpm run release:prep <version>` is what keeps the tree from getting here
      # with a stale version.
      - name: Verify the release tag matches package.json
        run: |
          set -euo pipefail
          manifest="$(jq -r .version package.json)"
          tag="${RELEASE_TAG#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${manifest}." >&2
            exit 1
          fi
          echo "Version ${manifest} matches the release tag."

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # version from package.json#packageManager

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm run check

      # QEMU and Buildx come BEFORE the smoke test now, because the smoke test needs them:
      # the arm64 image used to be pushed to GHCR without ever having been executed.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Build → test → push. Each architecture is loaded into the local daemon and booted
      # before anything is published; the multi-arch push below then reuses the same GHA
      # cache, so the bytes that reach GHCR are the ones that passed.
      # `load: true` takes a single platform at a time, hence two build steps.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: vuzon-release-smoke:amd64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64
        run: .github/scripts/smoke-test.sh vuzon-release-smoke:amd64 vuzon-smoke-amd64 linux/amd64

      - name: Build arm64 image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: vuzon-release-smoke:arm64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs under QEMU emulation. Slower, but it is the only thing standing between an
      # arm64-only regression and a silent crash-loop on every Raspberry Pi homelab.
      - name: Smoke test arm64
        run: .github/scripts/smoke-test.sh vuzon-release-smoke:arm64 vuzon-smoke-arm64 linux/arm64

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/kn990x/vuzon
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            # Also publish major-only (e.g. :2) for users who pin.
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}

      # Layers already cached from the two test builds above.
      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Split out so `contents: write` is scoped to the one thing that needs it. The build job
  # runs the whole toolchain — install, check, Docker — with no ability to alter the release.
  publish-assets:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Upload release assets (Compose + env template)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub renames assets starting with "." (e.g. .env.example → default.env.example).
          # We publish env.example instead, for a stable name and clean download URLs.
          cp .env.example env.example
          gh release upload "${RELEASE_TAG}" \
            docker-compose.yml \
            env.example \
            --clobber

# pnpm 11: project settings live here (not in .npmrc — that file is auth/registry only).
packages:
  - src/server
  - src/web
engineStrict: true
strictPeerDependencies: true
pmOnFail: error
allowBuilds:
  esbuild: true
# express-rate-limit 8.6 resolves ip-address to 10.2.0 and cannot move without a major.
# This floor closes the production advisory.
overrides:
  ip-address: '>=10.3.1'
# GHSA-mrhx-c7xc-m3w5 targets zod 4's core ($ZodArray). @vuzon/server is on zod 3, whose
# classic ZodArray is a separate implementation; the Dependabot alert was dismissed as
# inaccurate for that reason. Exposure is bounded anyway: the only array schemas sit behind
# requireAuth, and express.json caps the body at 256 kB. Without this entry the monthly
# `Security audit` stays red on a known, reviewed finding and stops being an alarm.
# Remove it with the move to zod 4 (>= 4.6.6 is patched).
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5

services:
  vuzon:
    container_name: vuzon
    image: ghcr.io/kn990x/vuzon:latest
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - vuzon-data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VUZON_PORT:-8001}:8001"
    # Healthcheck is declared in the Dockerfile; compose inherits it.

volumes:
  vuzon-data:
